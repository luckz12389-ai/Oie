name: Descompactar zip
on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: |
          for z in *.zip; do
            [ -f "$z" ] || exit 0
            unzip -o "$z"
            rm "$z"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Site Lunex descompactado" || exit 0
          git push
